version: "3.8"

services:
  db:
    image: postgres:17
    container_name: local_pg_db
    restart: always
    environment:
      POSTGRES_USER: ramdev
      POSTGRES_PASSWORD: Admin123$
      POSTGRES_DB: localsql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
